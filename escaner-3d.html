<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escáner 3D</title>
<style>
:root{--bg:#0e1511;--pn:#17211a;--tx:#e6efe8;--mt:#8aa191;--vd:#39ff7a;--ln:#2a3a2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:1.3rem;margin:4px 0 10px}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden}
.cam video,.cam canvas{display:block;width:100%}
.cam canvas{position:absolute;inset:0;height:100%}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:10px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{background:var(--vd);color:#04170a;border:0;border-radius:8px;padding:12px 14px;font-weight:700;font-size:1rem;flex:1;min-width:130px}
button.s{background:transparent;color:var(--vd);border:1px solid var(--vd)}
button:disabled{opacity:.35}
label{color:var(--mt);font-size:.9rem}
input,select{background:#0b110d;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px;width:90px}
input[type=range]{width:100%}
#msg{color:var(--vd);min-height:2.6em}
#pv{width:100%;background:#000;border-radius:10px;display:none;margin-top:10px}
small{color:var(--mt)}
</style></head><body>
<h1>Escáner 3D por vueltas</h1>
<div class="cam"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
<p id="msg">Toca “Abrir cámara”.</p>

<div class="pn">
 <button id="bCam">Abrir cámara</button>
 <div class="fila"><button id="bBg" class="s" disabled>1. Guardar fondo vacío</button></div>
 <div class="fila"><label>Sensibilidad</label><input id="th" type="range" min="30" max="200" value="80"></div>
</div>

<div class="pn">
 <div class="fila">
  <label>Vistas</label>
  <select id="nv"><option value="12">12 (30°)</option><option value="24" selected>24 (15°)</option><option value="36">36 (10°)</option></select>
  <label>Altura real (mm)</label><input id="mm" type="number" value="150">
 </div>
 <div class="fila"><button id="bCap" disabled>2. Capturar vista</button><button id="bUn" class="s" disabled>Deshacer</button></div>
 <small>Después de cada captura, gira el objeto el ángulo indicado.</small>
 <div class="fila"><label>Detalle</label><select id="res"><option value="80">Normal</option><option value="120" selected>Alto</option><option value="160">Máximo</option></select></div>
 <div class="fila"><button id="bPr" disabled>3. Procesar</button></div>
 <div class="fila"><button id="bPly" class="s" disabled>Descargar PLY</button><button id="bJs" class="s" disabled>Descargar JSON</button></div>
</div>
<canvas id="pv" width="480" height="480"></canvas>

<script>
const $=i=>document.getElementById(i),v=$('v'),ov=$('ov'),oc=ov.getContext('2d');
const wk=document.createElement('canvas'),wc=wk.getContext('2d',{willReadFrequently:true});
let W=480,H=360,bg=null,live=null,views=[],pts=null,info=null;
const msg=t=>$('msg').textContent=t;
const nv=()=>+$('nv').value,step=()=>360/nv();

$('bCam').onclick=async()=>{
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=s;await v.play();
  H=Math.round(W*v.videoHeight/v.videoWidth);wk.width=ov.width=W;wk.height=ov.height=H;
  $('bBg').disabled=false;$('bCam').style.display='none';
  msg('Pon el objeto en el centro de una hoja blanca. Quítalo y guarda el fondo vacío.');
  setInterval(tick,130);
 }catch(e){msg('No se pudo abrir la cámara. Usa HTTPS y permite el acceso.')}
};
const grab=()=>{wc.drawImage(v,0,0,W,H);return wc.getImageData(0,0,W,H).data};
$('bBg').onclick=()=>{bg=grab();$('bCap').disabled=false;msg('Fondo guardado. Pon el objeto en el centro (sobre el eje del giro) y captura.')};

function mask(d){
 const m=new Uint8Array(W*H),t=+$('th').value*3/ 1;
 for(let i=0,j=0;i<m.length;i++,j+=4){
  m[i]=(Math.abs(d[j]-bg[j])+Math.abs(d[j+1]-bg[j+1])+Math.abs(d[j+2]-bg[j+2]))>t/1.5?1:0;
 }
 // limpiar ruido: quitar píxeles aislados
 const o=m.slice();
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
  if(o[i]){if(o[i-1]+o[i+1]+o[i-W]+o[i+W]<2)m[i]=0}
  else if(o[i-1]+o[i+1]+o[i-W]+o[i+W]>2)m[i]=1}
 return m;
}
function tick(){
 if(!bg||pts)return;
 live=mask(grab());
 oc.clearRect(0,0,W,H);
 oc.fillStyle='#39ff7a';
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
  const i=y*W+x;
  if(live[i]&&(!live[i-1]||!live[i+1]||!live[i-W]||!live[i+W])&&((x+y)%2==0))oc.fillRect(x-1,y-1,2,2);
 }
 // eje del giro
 oc.strokeStyle='rgba(57,255,122,.25)';oc.beginPath();oc.moveTo(W/2,0);oc.lineTo(W/2,H);oc.stroke();
}
function upd(){
 const n=views.length,N=nv();
 $('bUn').disabled=!n;$('bPr').disabled=n<4;
 if(n>=N)msg('¡Listo! Escaneaste toda la vuelta. Toca “Procesar”.');
 else msg(`Vista ${n} de ${N}. Gira el objeto ${step()}° y captura la siguiente.`);
}
$('bCap').onclick=()=>{if(!live)return;views.push({m:live.slice(),a:views.length*step()});upd()};
$('bUn').onclick=()=>{views.pop();upd()};

$('bPr').onclick=()=>{
 msg('Procesando…');
 setTimeout(()=>{build();},30);
};
function build(){
 const N=+$('res').value,cx=W/2;
 const V=views.filter(o=>o.m.reduce((a,b)=>a+b,0)>60),tol=Math.floor(V.length*0.12);
 let minY=H,maxY=0,R=0;
 for(const o of V)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(o.m[y*W+x]){
  if(y<minY)minY=y;if(y>maxY)maxY=y;const r=Math.abs(x-cx);if(r>R)R=r}
 if(maxY<=minY){msg('No se detectó el objeto. Sube la sensibilidad y repite.');return}
 const hpx=maxY-minY+1,k=(+$('mm').value)/hpx,cy=(minY+maxY)/2;
 const side=Math.max(2*R+2,hpx+2),vox=new Uint8Array(N*N*N).fill(1);
 const cs=V.map(o=>[Math.cos(o.a*Math.PI/180),Math.sin(o.a*Math.PI/180)]);
 for(let ix=0;ix<N;ix++){const X=((ix+.5)/N-.5)*side;
  for(let iy=0;iy<N;iy++){const Y=((iy+.5)/N-.5)*side,py=Math.round(cy-Y);
   for(let iz=0;iz<N;iz++){const Z=((iz+.5)/N-.5)*side;
    let ok=1,miss=0;
    if(py<0||py>=H)ok=0;
    else for(let t=0;t<V.length;t++){
     const px=Math.round(cx+X*cs[t][0]+Z*cs[t][1]);
     if(px<0||px>=W||!V[t].m[py*W+px]){if(++miss>tol){ok=0;break}}
    }
    vox[(ix*N+iy)*N+iz]=ok;
 }}}
 const g=(a,b,c)=>a<0||b<0||c<0||a>=N||b>=N||c>=N?0:vox[(a*N+b)*N+c];
 const P=[];let yMin=1e9;
 for(let a=0;a<N;a++)for(let b=0;b<N;b++)for(let c=0;c<N;c++){
  if(!vox[(a*N+b)*N+c])continue;
  if(g(a-1,b,c)&&g(a+1,b,c)&&g(a,b-1,c)&&g(a,b+1,c)&&g(a,b,c-1)&&g(a,b,c+1))continue;
  const x=((a+.5)/N-.5)*side*k,y=((b+.5)/N-.5)*side*k,z=((c+.5)/N-.5)*side*k;
  P.push([+x.toFixed(2),+y.toFixed(2),+z.toFixed(2)]);if(y<yMin)yMin=y;
 }
 for(const p of P)p[1]=+(p[1]-yMin).toFixed(2);
 if(!P.length){msg('0 puntos: las siluetas no coinciden. Centra el objeto sobre el eje verde, no muevas el teléfono y repite.');return}
 pts=P;
 info={unidad:'mm',ejeVertical:'Y',vistas:views.length,rejilla:N,mmPorVoxel:+(side*k/N).toFixed(3),puntos:P.length};
 $('bPly').disabled=$('bJs').disabled=false;
 msg(`Listo: ${P.length} puntos (cada ${info.mmPorVoxel} mm). Descarga el archivo y envíamelo.`);
 oc.clearRect(0,0,W,H);preview();
}
function save(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
$('bPly').onclick=()=>save('objeto.ply',`ply\nformat ascii 1.0\nelement vertex ${pts.length}\nproperty float x\nproperty float y\nproperty float z\nend_header\n`+pts.map(p=>p.join(' ')).join('\n'),'text/plain');
$('bJs').onclick=()=>save('objeto.json',JSON.stringify({...info,puntos_xyz:pts}),'application/json');

function preview(){
 const c=$('pv'),x=c.getContext('2d');c.style.display='block';
 let mx=0,my=0;for(const p of pts){mx=Math.max(mx,Math.abs(p[0]),Math.abs(p[2]));my=Math.max(my,p[1])}
 const s=210/Math.max(mx,my/2,1);let a=0;
 (function f(){
  x.clearRect(0,0,480,480);x.fillStyle='#39ff7a';
  const ca=Math.cos(a),sa=Math.sin(a);
  for(const p of pts){x.fillRect(240+(p[0]*ca+p[2]*sa)*s,240+(my/2-p[1])*s,1.6,1.6)}
  a+=.02;requestAnimationFrame(f);
 })();
}
</script></body></html>
